[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-flywire"
version = "0.1.0"
description = "Connectome-constrained temporal behavior recognition experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
