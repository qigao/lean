name: Idle Tail focused TDD

on:
  push:
    branches:
      - feature/bb-replay-idle-tail-v1
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-idle-tail-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-idle-tail-elan-
            ${{ runner.os }}-elan-
      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-idle-tail-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-idle-tail-lake-${{ hashFiles('lean-toolchain') }}-
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-
      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake env lean --version
      - name: Build project anchor
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake build NarrativeDynamics.Core.FitnessABM
      - name: Build IdleTail
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake build NarrativeDynamics.Core.IdleTail
      - name: IdleTail focused consumer
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s \
            lake env lean -DmaxErrors=1 NarrativeDynamics/Tests/IdleTail.lean
      - name: Build FitnessABMIdleTail
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake build NarrativeDynamics.Core.FitnessABMIdleTail
      - name: Build FitnessABMReplay
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake build NarrativeDynamics.Core.FitnessABMReplay
      - name: FitnessABMIdleTail focused consumer
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s \
            lake env lean -DmaxErrors=1 NarrativeDynamics/Tests/FitnessABMIdleTail.lean
      - name: Build refactored Path4 test module
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake build NarrativeDynamics.Tests.FitnessABMPath4
      - name: Audit Path4 idle-tail refactor
        run: |
          if git grep -n 'private theorem run_idle' -- NarrativeDynamics/Tests/FitnessABMPath4.lean; then
            echo 'legacy test-local run_idle still exists' >&2
            exit 1
          fi
          git grep -n 'theorem tailState_idleTail' -- NarrativeDynamics/Tests/FitnessABMPath4.lean
          git grep -n 'theorem tailBelief_idleTail' -- NarrativeDynamics/Tests/FitnessABMPath4.lean
          git grep -n 'replay_append_idle' -- NarrativeDynamics/Tests/FitnessABMPath4.lean
