name: BB ABM development gate

on:
  push:
    branches:
      - feature/bb-abm-evolution-v1

permissions:
  contents: read

jobs:
  lean-development:
    name: Lean BB ABM development gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record checked revision
        run: |
          printf 'event=%s ref=%s requested_sha=%s run=%s attempt=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-

      - name: Resolve and record pinned dependencies
        id: resolve
        run: |
          set -euo pipefail
          lake update
          test -f lake-manifest.json
          cat lean-toolchain
          lake env lean --version
          mathlib_sha="$(git -C .lake/packages/mathlib rev-parse HEAD)"
          printf 'mathlib_sha=%s\n' "$mathlib_sha" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

      - name: Build and test present BB ABM cores
        run: |
          set -euo pipefail
          for suite in \
            NetworkPropagation \
            FitnessABM \
            FitnessABMReplay \
            FitnessABMDistribution; do
            core="NarrativeDynamics/Core/$suite.lean"
            test_file="NarrativeDynamics/Tests/$suite.lean"
            if [ ! -f "$core" ] && [ ! -f "$test_file" ]; then
              printf '%s and %s are pending development; skipping.\n' \
                "$core" "$test_file"
              continue
            fi
            if [ -f "$core" ]; then
              if [ ! -f "$test_file" ]; then
                printf 'Present core %s requires matching test %s.\n' \
                  "$core" "$test_file" >&2
                exit 1
              fi
              /usr/bin/time -f "$suite build elapsed=%e s peak_rss=%M KiB" \
                timeout --kill-after=10s 240s \
                  lake build "NarrativeDynamics.Core.$suite"
            else
              printf '%s is absent; running present test %s for RED.\n' \
                "$core" "$test_file"
            fi
            if [ "$suite" = FitnessABMReplay ]; then
              /usr/bin/time -f "BB ABM vectors build elapsed=%e s peak_rss=%M KiB" \
                timeout --kill-after=10s 240s \
                  lake build NarrativeDynamics.Conformance.FitnessABMVectors
            fi
            /usr/bin/time -f "$suite test elapsed=%e s peak_rss=%M KiB" \
              timeout --kill-after=10s 240s \
                lake env lean -DmaxErrors=64 "$test_file"
          done

      - name: Generate and compare BB ABM conformance corpus
        run: |
          set -euo pipefail
          generated="$(mktemp)"
          captured="$(mktemp)"
          trap 'rm -f "$generated" "$captured"' EXIT
          if ! /usr/bin/time -f "BB ABM exporter elapsed=%e s peak_rss=%M KiB" \
              timeout --kill-after=10s 240s \
                lake env lean --run NarrativeDynamics/Conformance/FitnessABMVectors.lean \
                >"$generated" 2>"$captured"; then
            cat "$generated" >&2
            cat "$captured" >&2
            exit 1
          fi
          cat "$captured" >&2
          test -s "$generated"
          test "$(wc -l < "$generated")" -eq 1
          test "$(tail -c 1 "$generated" | od -An -t u1 | tr -d ' ')" = 10
          printf '%s\n' BB_ABM_V1_JSON_BEGIN
          cat "$generated"
          printf '%s\n' BB_ABM_V1_JSON_END
          if [ -f conformance/bb_abm_v1.json ]; then
            cmp conformance/bb_abm_v1.json "$generated"
          else
            printf '%s\n' 'Initial generation: conformance/bb_abm_v1.json is absent.'
          fi
