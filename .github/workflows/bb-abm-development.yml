name: BB ABM development bootstrap

on:
  push:
    branches:
      - feature/bb-abm-evolution-v1

permissions:
  contents: read

jobs:
  lean-red:
    name: Lean dependency bootstrap and Task 1 RED
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record checked revision
        run: |
          printf 'event=%s ref=%s requested_sha=%s run=%s attempt=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-

      - name: Resolve and record pinned dependencies
        id: resolve
        run: |
          set -euo pipefail
          lake update
          test -f lake-manifest.json
          cat lean-toolchain
          lake env lean --version
          mathlib_sha="$(git -C .lake/packages/mathlib rev-parse HEAD)"
          printf 'mathlib_sha=%s\n' "$mathlib_sha" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

      - name: Build existing SocialMesh dependency closure
        run: lake build NarrativeDynamics.Core.SocialMesh

      - name: Run Task 1 NetworkPropagation RED
        run: |
          timeout --kill-after=10s 240s \
            lake env lean -DmaxErrors=8 NarrativeDynamics/Tests/NetworkPropagation.lean

      - name: Package resolved Lean environment
        id: package
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from urllib.parse import urlsplit

          configs = [
              path for path in Path('.lake/packages').rglob('config')
              if '.git' in path.parts
          ]
          if not configs:
              raise SystemExit('no Lake dependency git metadata found')
          for config in configs:
              result = subprocess.run(
                  ['git', 'config', '--file', str(config), '--null', '--list'],
                  check=True, stdout=subprocess.PIPE, text=True)
              for entry in result.stdout.split('\0'):
                  if not entry:
                      continue
                  key, separator, value = entry.partition('\n')
                  lowered = key.lower()
                  if lowered.startswith(('credential.', 'http.')):
                      raise SystemExit(f'credential-bearing git setting in {config}: {key}')
                  if lowered.startswith(('remote.', 'submodule.')) and lowered.endswith('.url'):
                      url = urlsplit(value)
                      if (url.scheme, url.hostname, url.username, url.password) != (
                          'https', 'github.com', None, None
                      ):
                          raise SystemExit(f'non-public dependency URL in {config}')
          print(f'audited {len(configs)} public dependency git config(s)')
          PY
          toolchain_dir="$(basename "$(lake env lean --print-prefix)")"
          archive="$RUNNER_TEMP/lean-v4.32.0-mathlib-environment.tar.zst"
          tar --zstd -cf "$archive" \
            -C "$HOME/.elan" bin "toolchains/$toolchain_dir" \
            -C "$GITHUB_WORKSPACE" lean-toolchain lake-manifest.json .lake/packages
          du -sh "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sb "$archive" | awk '{print "artifact_bytes=" $1}' | \
            tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

      - name: Upload resolved Lean environment
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-v4.32.0-mathlib-environment-${{ github.sha }}
          path: ${{ runner.temp }}/lean-v4.32.0-mathlib-environment.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
