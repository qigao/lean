name: two-stage-focused

on:
  push:
    branches:
      - manual/real-source-prep-v2

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact study revision
        uses: actions/checkout@v4
        with:
          repository: qigao/lean
          ref: e6f9cf51491d5785930186e7484b3258bf9cffe3
          persist-credentials: false
      - name: Run focused dataset hash scaling regression
        run: python3 -m unittest tests.test_two_stage_dataset_hash_scaling -v
