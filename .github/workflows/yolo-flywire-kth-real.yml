name: yolo-flywire-kth-real

on:
  workflow_dispatch:
    inputs:
      learning_rate:
        description: Development learning rate recorded in evidence
        required: true
        default: "0.001"
        type: string
      gru_hidden_dim:
        description: GRU hidden width under frozen parameter ceiling
        required: true
        default: "64"
        type: string
      graph_node_dim:
        description: Graph recurrent node width shared by graph arms
        required: true
        default: "2"
        type: string
  push:
    branches:
      - research/yolo-flywire-behavior-v0
    paths:
      - .github/workflows/yolo-flywire-kth-real.yml
      - python/yolo_flywire/kth_*.py
      - protocols/v1-kth-yolo11n-real-ci.json

permissions:
  contents: read

concurrency:
  group: yolo-flywire-kth-real-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: python
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  YOLO_AUTOINSTALL: "false"
  YOLO_OFFLINE: "true"
  YOLO11_URL: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n-pose.pt
  KTH_BASE_URL: https://www.csc.kth.se/cvap/actions

jobs:
  coordinator:
    name: Freeze KTH sequence and YOLO11 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact pose runtime
        run: |
          python -m pip install --only-binary=av -e "./python[pose]" \
            "ultralytics==8.4.146" "av==15.1.0" \
            "torch==2.14.0" "numpy==2.4.6" "opencv-python==5.0.0.93"

      - name: Download official KTH sequence definition
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$KTH_BASE_URL/00sequences.txt" --output 00sequences.txt

      - name: Download official YOLO11n pose checkpoint from GitHub Release
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$YOLO11_URL" --output yolo11n-pose.pt
          test -s yolo11n-pose.pt

      - name: Freeze exact KTH sequence/model/runtime identity
        run: |
          python -m yolo_flywire.kth_extract freeze \
            --protocol protocols/v1-kth-yolo11n-real-ci.json \
            --sequence-file 00sequences.txt \
            --weights yolo11n-pose.pt \
            --output frozen-runtime-protocol.json

      - name: Remove checkpoint before artifact publication
        if: always()
        run: rm -f yolo11n-pose.pt

      - name: Upload public coordinator evidence
        uses: actions/upload-artifact@v4
        with:
          name: kth-coordinator-${{ github.run_id }}
          path: |
            00sequences.txt
            frozen-runtime-protocol.json
          if-no-files-found: error
          retention-days: 30

  extract:
    name: Extract real KTH ${{ matrix.action }}
    needs: [coordinator]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        action:
          - boxing
          - handclapping
          - handwaving
          - jogging
          - running
          - walking
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact pose runtime
        run: |
          python -m pip install --only-binary=av -e "./python[pose]" \
            "ultralytics==8.4.146" "av==15.1.0" \
            "torch==2.14.0" "numpy==2.4.6" "opencv-python==5.0.0.93"

      - name: Download frozen coordinator evidence
        uses: actions/download-artifact@v4
        with:
          name: kth-coordinator-${{ github.run_id }}
          path: coordinator

      - name: Download official YOLO11n pose checkpoint from GitHub Release
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$YOLO11_URL" --output yolo11n-pose.pt
          test -s yolo11n-pose.pt

      - name: Download one official KTH action archive
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "$KTH_BASE_URL/${{ matrix.action }}.zip" --output "${{ matrix.action }}.zip"
          test -s "${{ matrix.action }}.zip"

      - name: Extract official KTH subsequences with final-test sealed
        run: |
          python -m yolo_flywire.kth_extract shard \
            --action "${{ matrix.action }}" \
            --archive "${{ matrix.action }}.zip" \
            --sequence-file coordinator/00sequences.txt \
            --protocol coordinator/frozen-runtime-protocol.json \
            --weights yolo11n-pose.pt \
            --output shard

      - name: Diagnose boxing decoder boundary on failure
        if: failure() && matrix.action == 'boxing'
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          import av

          archive = Path("boxing.zip")
          member = "person01_boxing_d4_uncomp.avi"
          successful_frames = 0
          last_pts = None
          last_time_base = None
          print("KTH_PYAV_DIAGNOSTIC member=" + member)
          with TemporaryDirectory(prefix="kth-boxing-d4-") as temporary:
              clip = Path(temporary) / member
              with ZipFile(archive, "r") as zipped:
                  with zipped.open(member, "r") as source, clip.open("wb") as target:
                      while chunk := source.read(1024 * 1024):
                          target.write(chunk)
              try:
                  with clip.open("rb") as handle, av.open(handle, mode="r", format="avi") as container:
                      stream = container.streams.video[0]
                      stream.codec_context.thread_count = 1
                      stream.codec_context.options = {"err_detect": "explode"}
                      print(f"KTH_PYAV_DIAGNOSTIC declared_stream_frames={stream.frames}")
                      for frame in container.decode(stream):
                          successful_frames += 1
                          last_pts = frame.pts
                          last_time_base = frame.time_base
              except BaseException as exc:
                  print(f"KTH_PYAV_DIAGNOSTIC successful_frames={successful_frames}")
                  print(f"KTH_PYAV_DIAGNOSTIC last_pts={last_pts}")
                  print(f"KTH_PYAV_DIAGNOSTIC last_time_base={last_time_base}")
                  print(f"KTH_PYAV_DIAGNOSTIC exception_type={type(exc).__module__}.{type(exc).__name__}")
                  print(f"KTH_PYAV_DIAGNOSTIC exception_repr={exc!r}")
              else:
                  print(f"KTH_PYAV_DIAGNOSTIC successful_frames={successful_frames}")
                  print(f"KTH_PYAV_DIAGNOSTIC last_pts={last_pts}")
                  print(f"KTH_PYAV_DIAGNOSTIC last_time_base={last_time_base}")
                  print("KTH_PYAV_DIAGNOSTIC exception_type=None")
                  print("KTH_PYAV_DIAGNOSTIC exception_repr=None")
          PY

      - name: Remove KTH RGB archive and model before artifact publication
        if: always()
        run: rm -f "${{ matrix.action }}.zip" yolo11n-pose.pt

      - name: Upload URL-free pose/evidence shard only
        uses: actions/upload-artifact@v4
        with:
          name: kth-${{ matrix.action }}-${{ github.run_id }}
          path: shard
          if-no-files-found: error
          retention-days: 1

  aggregate-and-compare:
    name: Aggregate real KTH and run four-arm development
    needs: [coordinator, extract]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEARNING_RATE: ${{ inputs.learning_rate || '0.001' }}
      GRU_HIDDEN_DIM: ${{ inputs.gru_hidden_dim || '64' }}
      GRAPH_NODE_DIM: ${{ inputs.graph_node_dim || '2' }}
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development runtime
        run: python -m pip install -e "./python[dev]" "numpy==2.4.6" "torch==2.14.0"

      - name: Download frozen coordinator evidence
        uses: actions/download-artifact@v4
        with:
          name: kth-coordinator-${{ github.run_id }}
          path: coordinator

      - name: Download all six KTH extraction shards
        uses: actions/download-artifact@v4
        with:
          pattern: kth-*-${{ github.run_id }}
          path: shards
          merge-multiple: false

      - name: Aggregate exact 600-video and 2391-subsequence source evidence
        run: |
          python -m yolo_flywire.kth_aggregate \
            --sequence-file coordinator/00sequences.txt \
            --protocol coordinator/frozen-runtime-protocol.json \
            --shards-root shards \
            --output aggregate
          mkdir aggregate/bundle
          mv aggregate/manifest.json aggregate/observations.jsonl aggregate/timing.jsonl aggregate/bundle/

      - name: Download pinned FlyWire connectivity and generate exact controls
        run: |
          commit=0d8574d46627ce7fadd968a3c5d602e837325373
          path=data/type_to_type_connection_and_synapse_counts.csv
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/murthylab/visual-system-parts-list/${commit}/${path}" \
            --output flywire-connectivity.csv
          python -m yolo_flywire.provenance generate \
            --config aggregate/frozen-protocol.json \
            --source flywire-connectivity.csv \
            --output controls
          python -m yolo_flywire.provenance verify \
            --config aggregate/frozen-protocol.json \
            --source flywire-connectivity.csv \
            --output controls

      - name: Freeze explicit complete-roster development condition
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          source = json.loads(Path("aggregate/source-manifest.json").read_text(encoding="utf-8"))
          train_count = sum(row["split"] == "train" for row in source["subsequences"])
          batch_size = (train_count + 1) // 2
          if train_count < 2 or 20 * math.ceil(train_count / batch_size) != 40:
              raise SystemExit("KTH complete train roster cannot satisfy frozen 40-update budget")
          config = {
              "seeds": [7, 11, 19, 23, 31],
              "epochs": 20,
              "lr": float(os.environ["LEARNING_RATE"]),
              "batch_size": batch_size,
              "max_updates": 40,
              "parameter_ceiling": 50000,
              "gru_hidden_dim": int(os.environ["GRU_HIDDEN_DIM"]),
              "graph_node_dim": int(os.environ["GRAPH_NODE_DIM"]),
          }
          if config["lr"] <= 0 or config["gru_hidden_dim"] <= 0 or config["graph_node_dim"] <= 0:
              raise SystemExit("KTH development hyperparameters must be positive")
          Path("execution-config.json").write_text(
              json.dumps(config, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8"
          )
          print(f"KTH training_subsequences={train_count} batch_size={batch_size}")
          PY

      - name: Execute existing indexed four-arm core on real KTH pose observations
        run: |
          protocol_sha=$(sha256sum aggregate/frozen-protocol.json | awk '{print $1}')
          controls_sha=$(sha256sum controls/control-bundle.json | awk '{print $1}')
          python -m yolo_flywire.kth_development run \
            --protocol aggregate/frozen-protocol.json \
            --protocol-sha256 "$protocol_sha" \
            --source-manifest aggregate/source-manifest.json \
            --bundle aggregate/bundle \
            --execution-config execution-config.json \
            --connectivity flywire-connectivity.csv \
            --controls controls/control-bundle.json \
            --controls-sha256 "$controls_sha" \
            --output development

      - name: Stage real KTH development evidence only
        run: |
          mkdir final-evidence
          cp aggregate/source-manifest.json final-evidence/
          cp aggregate/frozen-protocol.json final-evidence/
          cp aggregate/bundle/manifest.json final-evidence/aggregate-manifest.json
          cp execution-config.json final-evidence/
          cp development/development_report.json final-evidence/
          cp controls/flywire-selected-graph.json final-evidence/
          cp controls/verification-run.json final-evidence/

      - name: Delete intermediate pose and downloaded source bytes before final upload
        if: always()
        run: rm -rf shards aggregate/bundle

      - name: Upload real KTH development report
        uses: actions/upload-artifact@v4
        with:
          name: yolo-flywire-kth-real-development-${{ github.run_id }}
          path: final-evidence
          if-no-files-found: error
          retention-days: 30
