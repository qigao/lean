name: flywire-cx-gate1-ci

on:
  push:
    branches:
      - research/flywire-cx-temporal-gate1
  pull_request:
    branches:
      - research/yolo-flywire-behavior-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: CX protocol contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e "./python[dev]"
      - name: Run CX and legacy protocol tests
        run: python -m pytest tests/test_cx_protocol.py tests/test_protocol_manifest.py tests/test_v0_protocol.py -q

  lean:
    name: Existing Lean contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean project
        run: lake build
