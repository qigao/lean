name: flywire-cx-gate1-ci

on:
  push:
    branches:
      - research/flywire-cx-temporal-gate1
  pull_request:
    branches:
      - research/yolo-flywire-behavior-v0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: CX graph event skeleton and provenance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight CX test runtime
        run: |
          python -m pip install pytest numpy
          python -m pip install --no-deps -e ./python
      - name: Run CX graph/event/skeleton/provenance gates
        run: python -m pytest tests/test_cx_protocol.py tests/test_cx_artifact.py tests/test_cx_nulls.py tests/test_cx_events.py tests/test_ntu_skeleton.py tests/test_cx_skeleton_prep.py tests/test_cx_provenance.py -q

  temporal:
    name: CX preparation temporal training and development contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install CPU-only temporal test runtime
        run: |
          python -m pip install pytest numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e ./python
      - name: Run CX preparation/temporal/training/development RED/GREEN gates
        run: python -m pytest tests/test_cx_prepare.py tests/test_cx_lif.py tests/test_cx_evaluation.py tests/test_cx_training.py tests/test_cx_development.py -q

  legacy-protocol:
    name: Existing YOLO/FlyWire protocol compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install CPU-only compatibility runtime
        run: |
          python -m pip install pytest numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e ./python
      - name: Run existing protocol gates
        run: python -m pytest tests/test_protocol_manifest.py tests/test_v0_protocol.py -q

  lean:
    name: Existing Lean contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean project
        run: lake build
