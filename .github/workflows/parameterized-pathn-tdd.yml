name: Parameterized PathN TDD

on:
  push:
    branches:
      - feature/bb-parameterized-pathn-convergence-v1

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-
      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-
      - name: Resolve Lean dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Verify existing parameter module
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake build NarrativeDynamics.Core.FitnessABMPathNParameters
      - name: Build parameterized PathN convergence module
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake build NarrativeDynamics.Core.FitnessABMPathNParameterConvergence
      - name: Focused parameterized PathN convergence consumer
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake env lean -DmaxErrors=1 NarrativeDynamics/Tests/FitnessABMPathNParameterConvergence.lean
