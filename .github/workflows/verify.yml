name: Verify Lean model

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check proofs
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          nanoda: false
      - name: Replay executable runtime scenario
        run: lake exe browser-runtime-check
      - name: Replay driver JSONL conformance trace
        run: lake exe browser-driver-trace-check traces/generation-race.jsonl
      - name: Replay unified async driver trace
        run: lake exe browser-async-trace-check traces/async-runtime-race.jsonl
