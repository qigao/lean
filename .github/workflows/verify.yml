name: Verify Lean model

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all Lean targets
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          nanoda: false

      # Public proof verification. These checks define the supported theorem surface.
      - name: "Public: enforce proof API boundary"
        run: |
          cat > /tmp/public-proof-api-boundary.lean <<'EOF'
          import Browser.ProofAPI
          #check Browser.AsyncRuntime
          EOF
          set +e
          lake env lean /tmp/public-proof-api-boundary.lean > /tmp/public-proof-api-boundary.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/public-proof-api-boundary.log
            echo "::error::Browser.ProofAPI leaks Browser.AsyncRuntime; async runtime belongs to Browser.Integration"
            exit 1
          fi
          if ! grep -Eqi "unknown (identifier|constant).*Browser.AsyncRuntime" /tmp/public-proof-api-boundary.log; then
            cat /tmp/public-proof-api-boundary.log
            echo "::error::public proof boundary probe failed for an unexpected reason"
            exit 1
          fi
      - name: "Public: verify interaction contracts"
        run: lake exe browser-interaction-check
      - name: "Public: verify bounded recovery contracts"
        run: lake exe browser-recovery-check
      - name: "Public: verify feedback normalization and recovery"
        run: lake exe browser-feedback-recovery-check
      - name: "Public: verify decoder to recovery convergence"
        run: lake exe browser-decoder-recovery-check
      - name: "Public: verify adversarial recovery convergence"
        run: lake exe browser-adversarial-recovery-check
      - name: "Public: verify finite fault aggregation"
        run: lake exe browser-fault-aggregation-check
      - name: "Public: verify runtime trace aggregation equivalence"
        run: lake exe browser-trace-aggregation-check
      - name: "Public: verify closed-loop recovery convergence"
        run: lake exe browser-closed-loop-check

      # Integration/reference regression. These preserve executable/runtime evidence
      # without enlarging Browser.ProofAPI.
      - name: "Integration: compile C++ InteractionJournal smoke test"
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Idriver/include \
            driver/examples/interaction_journal_smoke.cpp \
            driver/src/interaction_journal.cpp \
            -o /tmp/interaction-journal-smoke
          /tmp/interaction-journal-smoke
      - name: "Integration: compile C++ InteractionBoundary smoke test"
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Idriver/include \
            driver/examples/interaction_boundary_smoke.cpp \
            driver/src/interaction_journal.cpp \
            -o /tmp/interaction-boundary-smoke
          /tmp/interaction-boundary-smoke
      - name: "Integration: compile C++ JSONL journal emitter"
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Idriver/include \
            driver/examples/emit_interaction_trace.cpp \
            driver/src/interaction_journal.cpp \
            driver/src/jsonl_interaction_sink.cpp \
            -o /tmp/emit-interaction-trace
          /tmp/emit-interaction-trace /tmp/driver-interaction-journal.jsonl
      - name: "Integration: verify C++ generated multi-lane interaction journal"
        run: lake exe browser-driver-interaction-journal-check /tmp/driver-interaction-journal.jsonl
      - name: "Integration: replay canonical multi-lane interaction journal"
        run: lake exe browser-driver-interaction-journal-check traces/driver-interaction-journal.jsonl
      - name: "Integration: replay compact interaction journal"
        run: lake exe browser-interaction-trace-check traces/interaction-contracts.jsonl
      - name: "Integration: replay executable runtime scenario"
        run: lake exe browser-runtime-check
      - name: "Integration: replay driver JSONL conformance trace"
        run: lake exe browser-driver-trace-check traces/generation-race.jsonl
      - name: "Integration: replay unified async driver trace"
        run: lake exe browser-async-trace-check traces/async-runtime-race.jsonl
