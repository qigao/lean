name: Phase 2 classifier dev

on:
  push:
    branches:
      - feature/phase2-receptivity-schedule-classifier

jobs:
  classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
      - name: Resolve Lean dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Build Lean library
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
      - name: Phase 2 focused RED/GREEN gate
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          bash tools/check_fitness_abm_schedule_classifier.sh
