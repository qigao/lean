name: yolo-flywire-ci

on:
  push:
    branches:
      - research/yolo-flywire-behavior-v0
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean project
        run: lake build

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e "./python[dev]"
      - name: Run Python tests
        run: python -m pytest tests -q

  pose-integration:
    name: Pose extraction integration
    needs: [lean]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOLO_AUTOINSTALL: "false"
      YOLO_OFFLINE: "true"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            .github/workflows/yolo-flywire-ci.yml
      - name: Install explicit extraction test dependencies
        run: python -m pip install --only-binary=av -e "./python[dev]" "ultralytics==8.4.146" "av==15.1.0"
      - name: Exercise actual decoder and untrained local model without network
        run: python -m pytest integration -q -s

  flywire-provenance:
    name: Freeze FlyWire provenance
    needs: [lean, python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: python
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight graph dependency
        run: python -m pip install "numpy>=1.26"
      - name: Download pinned v783 type connectivity
        shell: bash
        run: |
          set -euo pipefail
          commit=0d8574d46627ce7fadd968a3c5d602e837325373
          path=data/type_to_type_connection_and_synapse_counts.csv
          curl --fail --location --silent --show-error --max-time 60 \
            "https://raw.githubusercontent.com/murthylab/visual-system-parts-list/${commit}/${path}" \
            --output flywire-connectivity.csv
      - name: Compute verified cache identity
        id: identity
        shell: bash
        run: |
          key=$(python -m yolo_flywire.provenance key --config protocols/v0-real-ntu120-preflight.json --source flywire-connectivity.csv --output .cache/flywire-controls)
          echo "key=flywire-controls-v1-${key}" >> "$GITHUB_OUTPUT"
      - name: Restore exact control bundle
        id: controls
        uses: actions/cache/restore@v4
        with:
          path: .cache/flywire-controls
          key: ${{ steps.identity.outputs.key }}
      - name: Generate controls on exact cache miss
        if: steps.controls.outputs.cache-hit != 'true'
        run: python -m yolo_flywire.provenance generate --config protocols/v0-real-ntu120-preflight.json --source flywire-connectivity.csv --output .cache/flywire-controls
      - name: Verify control fingerprints and invariants
        run: python -m yolo_flywire.provenance verify --config protocols/v0-real-ntu120-preflight.json --source flywire-connectivity.csv --output .cache/flywire-controls
      - name: Save verified control bundle
        if: steps.controls.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/flywire-controls
          key: ${{ steps.identity.outputs.key }}
      - name: Upload provenance record
        uses: actions/upload-artifact@v4
        with:
          name: flywire-v783-provenance
          path: .cache/flywire-controls/*.json
          if-no-files-found: error
