name: yolo-flywire-ci

on:
  push:
    branches:
      - research/yolo-flywire-behavior-v0
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean project
        run: lake build

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e "./python[dev]"

      - name: Run Python tests
        run: python -m pytest tests -q

  flywire-provenance:
    name: Freeze FlyWire provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight graph dependency
        run: python -m pip install "numpy>=1.26"

      - name: Download pinned v783 type connectivity
        shell: bash
        run: |
          set -euo pipefail
          commit=0d8574d46627ce7fadd968a3c5d602e837325373
          path=data/type_to_type_connection_and_synapse_counts.csv
          url="https://raw.githubusercontent.com/murthylab/visual-system-parts-list/${commit}/${path}"
          curl --fail --location --silent --show-error "$url" --output flywire-connectivity.csv
          {
            echo "source_repo=murthylab/visual-system-parts-list"
            echo "source_commit=${commit}"
            echo "source_path=${path}"
            echo "sha256=$(sha256sum flywire-connectivity.csv | cut -d' ' -f1)"
            echo "bytes=$(wc -c < flywire-connectivity.csv | tr -d ' ')"
          } | tee flywire-provenance.txt

      - name: Derive frozen T4/T5 graph and matched rewired controls
        env:
          PYTHONPATH: python
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          import json

          from yolo_flywire.flywire import load_visual_type_graph
          from yolo_flywire.graphs import graph_fingerprint, rewire_degree_preserving

          seed_types = ("T4a", "T4b", "T4c", "T4d", "T5a", "T5b", "T5c", "T5d")
          training_seeds = (7, 11, 19, 23, 31)
          selection = load_visual_type_graph(
              "flywire-connectivity.csv",
              seed_types=seed_types,
              min_seed_synapses=5,
          )
          graph = selection.graph
          fingerprint = graph_fingerprint(graph)
          diagonal = {
              (source, target, weight)
              for source, target, weight in zip(graph.src, graph.dst, graph.weight)
              if source == target
          }
          offdiagonal_count = graph.num_edges - len(diagonal)
          swaps = 10 * offdiagonal_count
          original_degrees = (Counter(graph.src), Counter(graph.dst))
          original_weights = sorted(graph.weight)

          rewired_fingerprints = {}
          for seed in training_seeds:
              rewired = rewire_degree_preserving(graph, seed=seed, swaps=swaps)
              rewired_diagonal = {
                  (source, target, weight)
                  for source, target, weight in zip(rewired.src, rewired.dst, rewired.weight)
                  if source == target
              }
              if (Counter(rewired.src), Counter(rewired.dst)) != original_degrees:
                  raise SystemExit(f"seed {seed}: directed degree sequence changed")
              if sorted(rewired.weight) != original_weights:
                  raise SystemExit(f"seed {seed}: weight multiset changed")
              if rewired_diagonal != diagonal:
                  raise SystemExit(f"seed {seed}: diagonal population edges changed")
              rewired_fingerprints[str(seed)] = graph_fingerprint(rewired)

          graph_record = {
              "node_types": selection.node_types,
              "num_nodes": graph.num_nodes,
              "num_edges": graph.num_edges,
              "num_diagonal_edges": len(diagonal),
              "num_offdiagonal_edges": offdiagonal_count,
              "diagonal_edge_semantics": "within-cell-type population connectivity, not neuron autapses",
              "graph_fingerprint": fingerprint,
              "seed_types": seed_types,
              "min_seed_synapses": 5,
              "rewiring_algorithm": "directed-double-edge-swap-v2-diagonal-fixed",
              "rewiring_successful_swaps_per_offdiagonal_edge": 10,
              "rewiring_successful_swaps": swaps,
              "rewired_graph_fingerprints": rewired_fingerprints,
          }
          with open("flywire-selected-graph.json", "w", encoding="utf-8") as handle:
              json.dump(graph_record, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          with open("flywire-provenance.txt", "a", encoding="utf-8") as handle:
              handle.write(f"selected_nodes={graph.num_nodes}\n")
              handle.write(f"selected_edges={graph.num_edges}\n")
              handle.write(f"selected_diagonal_edges={len(diagonal)}\n")
              handle.write(f"selected_graph_fingerprint={fingerprint}\n")
              handle.write(f"rewiring_successful_swaps={swaps}\n")
              for seed, value in rewired_fingerprints.items():
                  handle.write(f"rewired_graph_fingerprint_seed_{seed}={value}\n")
          print(json.dumps(graph_record, indent=2))
          PY

      - name: Upload provenance record
        uses: actions/upload-artifact@v4
        with:
          name: flywire-v783-provenance
          path: |
            flywire-provenance.txt
            flywire-selected-graph.json
          if-no-files-found: error
