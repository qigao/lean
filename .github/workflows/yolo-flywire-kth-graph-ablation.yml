name: yolo-flywire-kth-graph-ablation

on:
  workflow_dispatch:
  push:
    branches:
      - research/yolo-flywire-behavior-v0
    paths:
      - .github/workflows/yolo-flywire-kth-graph-ablation.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: yolo-flywire-kth-graph-ablation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: python
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PREPARED_ARTIFACT_ID: "10333301800"
  PREPARED_ARTIFACT_NAME: kth-reuse-prepared-34806767442
  PREPARED_RUN_ID: "34806767442"
  PREPARED_HEAD_SHA: "657b7f166761f4b6baf7ec0202437ed099f5dcf0"

jobs:
  prepare:
    name: Bind exact cached real-KTH development input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ablation head
        uses: actions/checkout@v4

      - name: Verify and download exact prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREPARED_ARTIFACT_ID}" \
            --output artifact-metadata.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta = json.loads(Path("artifact-metadata.json").read_text(encoding="utf-8"))
          if meta.get("id") != int(os.environ["PREPARED_ARTIFACT_ID"]):
              raise SystemExit("KTH ablation prepared artifact id mismatch")
          if meta.get("name") != os.environ["PREPARED_ARTIFACT_NAME"]:
              raise SystemExit("KTH ablation prepared artifact name mismatch")
          run = meta.get("workflow_run", {})
          if str(run.get("id")) != os.environ["PREPARED_RUN_ID"]:
              raise SystemExit("KTH ablation prepared source run mismatch")
          if run.get("head_sha") != os.environ["PREPARED_HEAD_SHA"]:
              raise SystemExit("KTH ablation prepared source head mismatch")
          if meta.get("expired") is not False:
              raise SystemExit("KTH ablation prepared artifact expired")
          digest = meta.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("KTH ablation prepared artifact digest missing")
          print(f"prepared artifact id={meta['id']} digest={digest}")
          PY
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREPARED_ARTIFACT_ID}/zip" \
            --output prepared.zip
          mkdir prepared
          unzip -q prepared.zip -d prepared
          test -f prepared/aggregate/frozen-protocol.json
          test -f prepared/aggregate/source-manifest.json
          test -f prepared/aggregate/bundle/manifest.json
          test -f prepared/aggregate/bundle/observations.jsonl
          test -f prepared/aggregate/bundle/timing.jsonl
          test -f prepared/execution-config.json
          test -f prepared/flywire-connectivity.csv
          test -f prepared/controls/flywire-selected-graph.json

      - name: Require sealed final-test boundary and frozen five-seed budget
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          protocol = json.loads(Path("prepared/aggregate/frozen-protocol.json").read_text(encoding="utf-8"))
          config = json.loads(Path("prepared/execution-config.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("prepared/aggregate/bundle/manifest.json").read_text(encoding="utf-8"))
          expected_seeds = [7, 11, 19, 23, 31]
          if protocol.get("seeds") != expected_seeds or config.get("seeds") != expected_seeds:
              raise SystemExit("KTH graph ablation seed roster differs from frozen protocol")
          if config.get("epochs") != 20 or config.get("max_updates") != 40 or config.get("parameter_ceiling") != 50000:
              raise SystemExit("KTH graph ablation budget differs from frozen development condition")
          if protocol.get("final_test_decoded") is not False or protocol.get("classifier_evaluated") is not False:
              raise SystemExit("KTH graph ablation protocol crossed final-test boundary")
          if manifest.get("final_test_decoded") is not False or manifest.get("classifier_evaluated") is not False:
              raise SystemExit("KTH graph ablation pose bundle crossed final-test boundary")
          print("KTH graph ablation prepared input verified")
          PY

      - name: Re-publish exact prepared input for this run
        uses: actions/upload-artifact@v4
        with:
          name: kth-graph-ablation-prepared-${{ github.run_id }}
          path: prepared
          if-no-files-found: error
          retention-days: 1

  seed:
    name: Four normalized graph variants for seed ${{ matrix.seed }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed:
          - 7
          - 11
          - 19
          - 23
          - 31
    steps:
      - name: Checkout ablation head
        uses: actions/checkout@v4

      - name: Set up Python 3.11 with shared pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install development runtime
        run: python -m pip install -e "./python[dev]" "numpy==2.4.6" "torch==2.14.0"

      - name: Download exact prepared input
        uses: actions/download-artifact@v4
        with:
          name: kth-graph-ablation-prepared-${{ github.run_id }}
          path: prepared

      - name: Train four normalized architecture variants for one seed
        run: |
          protocol_sha=$(sha256sum prepared/aggregate/frozen-protocol.json | awk '{print $1}')
          python -m yolo_flywire.kth_graph_ablation seed \
            --protocol prepared/aggregate/frozen-protocol.json \
            --protocol-sha256 "$protocol_sha" \
            --source-manifest prepared/aggregate/source-manifest.json \
            --bundle prepared/aggregate/bundle \
            --execution-config prepared/execution-config.json \
            --connectivity prepared/flywire-connectivity.csv \
            --selected-graph prepared/controls/flywire-selected-graph.json \
            --seed "${{ matrix.seed }}" \
            --output seed-output
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("seed-output/seed_report.json").read_text(encoding="utf-8"))
          for row in report["variants"]:
              print(row["variant"], "macro_f1=", row["validation_metrics"]["macro_f1"],
                    "best_epoch=", row["best_epoch"], "params=", row["parameter_count"])
          PY

      - name: Upload one-seed development-only ablation evidence
        uses: actions/upload-artifact@v4
        with:
          name: kth-graph-ablation-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: seed-output/seed_report.json
          if-no-files-found: error
          retention-days: 1

  reduce:
    name: Reduce five seeds and compute factorial effects
    needs: [prepare, seed]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ablation head
        uses: actions/checkout@v4

      - name: Set up Python 3.11 with shared pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install development runtime
        run: python -m pip install -e "./python[dev]" "numpy==2.4.6" "torch==2.14.0"

      - name: Download exact prepared input
        uses: actions/download-artifact@v4
        with:
          name: kth-graph-ablation-prepared-${{ github.run_id }}
          path: prepared

      - name: Download all five seed reports
        uses: actions/download-artifact@v4
        with:
          pattern: kth-graph-ablation-seed-*-${{ github.run_id }}
          path: seed-reports
          merge-multiple: false

      - name: Reduce exact five-seed ablation evidence
        run: |
          python -m yolo_flywire.kth_graph_ablation reduce \
            --protocol prepared/aggregate/frozen-protocol.json \
            --reports-root seed-reports \
            --output reduced

      - name: Compute paired 2x2 architecture effects
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = Path("reduced/graph_ablation_report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          names = {
              "dm": "normalized_dense_mean_d2",
              "df": "normalized_dense_flatten_d2",
              "sm": "normalized_selected_mean_d2",
              "sf": "normalized_selected_flatten_d2",
          }
          by_variant = {}
          for key, name in names.items():
              rows = report["summary"][name]["macro_f1_by_seed"]
              by_variant[key] = {row["seed"]: float(row["macro_f1"]) for row in rows}
          seeds = report["seeds"]
          rows = []
          for seed in seeds:
              dm, df = by_variant["dm"][seed], by_variant["df"][seed]
              sm, sf = by_variant["sm"][seed], by_variant["sf"][seed]
              rows.append({
                  "seed": seed,
                  "readout_flatten_main_effect": 0.5 * ((df - dm) + (sf - sm)),
                  "selected_input_main_effect": 0.5 * ((sm - dm) + (sf - df)),
                  "interaction": (sf - sm) - (df - dm),
                  "selected_flatten_vs_dense_mean": sf - dm,
              })
          keys = tuple(name for name in rows[0] if name != "seed")
          means = {key: sum(row[key] for row in rows) / len(rows) for key in keys}
          for value in (*means.values(), *(row[key] for row in rows for key in keys)):
              if not math.isfinite(value):
                  raise SystemExit("KTH graph ablation factorial effect is non-finite")
          effects = {
              "format_version": 1,
              "kind": "kth_real_graph_ablation_factorial_effects",
              "evidence_scope": "kth_real_development_graph_ablation_only",
              "final_test_evaluated": False,
              "topology_claim_evaluated": False,
              "seeds": seeds,
              "paired_effects": rows,
              "mean_effects": means,
          }
          Path("factorial-effects.json").write_text(
              json.dumps(effects, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print("variant_means", json.dumps({
              name: report["summary"][name]["mean_macro_f1"] for name in names.values()
          }, sort_keys=True))
          print("factorial_mean_effects", json.dumps(means, sort_keys=True))
          PY

      - name: Stage final development-only evidence
        run: |
          mkdir final-evidence
          cp artifact-metadata.json final-evidence/ 2>/dev/null || true
          cp prepared/aggregate/frozen-protocol.json final-evidence/
          cp prepared/aggregate/source-manifest.json final-evidence/
          cp prepared/aggregate/bundle/manifest.json final-evidence/aggregate-manifest.json
          cp prepared/execution-config.json final-evidence/
          cp prepared/controls/flywire-selected-graph.json final-evidence/
          cp reduced/graph_ablation_report.json final-evidence/
          cp factorial-effects.json final-evidence/
          cp -r seed-reports final-evidence/seed-reports

      - name: Upload cached real-KTH graph ablation report
        uses: actions/upload-artifact@v4
        with:
          name: yolo-flywire-kth-graph-ablation-${{ github.run_id }}
          path: final-evidence
          if-no-files-found: error
          retention-days: 30
