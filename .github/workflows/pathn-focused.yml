name: PathN focused TDD

on:
  push:
    branches:
      - feature/bb-pathn-convergence-v1
  pull_request:
    branches:
      - proof/narrative-dynamics-v0
    paths:
      - 'NarrativeDynamics/Core/FiniteConsensus.lean'
      - 'NarrativeDynamics/Core/FitnessABMPathN.lean'
      - 'NarrativeDynamics/Tests/FiniteConsensus.lean'
      - 'NarrativeDynamics/Tests/FitnessABMPathN.lean'
      - '.github/workflows/pathn-focused.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Lean dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake env lean --version
      - name: Build FiniteConsensus
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake build NarrativeDynamics.Core.FiniteConsensus
      - name: FiniteConsensus focused consumer
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake env lean -DmaxErrors=1 \
            NarrativeDynamics/Tests/FiniteConsensus.lean
      - name: PathN RED consumer
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=10s 240s lake env lean -DmaxErrors=1 \
            NarrativeDynamics/Tests/FitnessABMPathN.lean
