name: pose-temporal-snn

on:
  push:
    branches:
      - research/pose-temporal-snn-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Pose temporal SNN data and protocol contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test runtime
        run: python -m pip install pytest numpy
      - name: Run lightweight RED/GREEN gates
        env:
          PYTHONPATH: pose_snn/src
        run: >-
          python -m pytest
          pose_snn/tests/test_protocol.py
          pose_snn/tests/test_ntu.py
          pose_snn/tests/test_normalization.py
          pose_snn/tests/test_events.py
          -q

  models:
    name: Pose temporal SNN model contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pose_snn/pyproject.toml
      - name: Install CPU-only model runtime
        run: |
          python -m pip install pytest numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run RSNN RED/GREEN gate
        env:
          PYTHONPATH: pose_snn/src
        run: python -m pytest pose_snn/tests/test_rsnn.py -q
