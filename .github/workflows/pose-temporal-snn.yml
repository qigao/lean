name: pose-temporal-snn

on:
  push:
    branches:
      - research/pose-temporal-snn-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Pose temporal SNN protocol contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test runtime
        run: python -m pip install pytest
      - name: Run protocol RED/GREEN gate
        env:
          PYTHONPATH: pose_snn/src
        run: python -m pytest pose_snn/tests/test_protocol.py -q
