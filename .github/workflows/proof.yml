  verify:
    # Join independently accepted Python and Lean families; skip Studio on upstream RED.
    needs: [python-tests, lean-proof]
    # BB branches exclude peripheral UI, WebSocket and browser integration tests.
    # These jobs remain enabled on other branches; skipped does not mean tested.
    if: ${{ success() && !startsWith(github.head_ref || github.ref_name, 'feature/fitness-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: lean-ci-runner-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checked revision
        run: git rev-parse HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-world-studio.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: world_studio_web/package-lock.json

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-world-studio.txt

      - name: Install locked browser dependencies
        working-directory: world_studio_web
        run: npm ci

      - name: Cache Playwright Chromium
        id: chromium_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-v1-${{ hashFiles('world_studio_web/package-lock.json') }}
      - name: Install Chromium
        working-directory: world_studio_web
        run: |
          printf 'Chromium exact-key cache hit=%s\n' '${{ steps.chromium_cache.outputs.cache-hit }}'
          npx playwright install --with-deps chromium

      - name: Verify Python studio and coordinator
        run: |
          python -m pytest tests/test_world_studio_*.py tests/test_network_abm_scenario_coordinator.py tests/test_network_abm_scenario_checkpoint_store.py tests/test_network_abm_simulation_output_bus.py tests/test_network_abm_public_api.py -q
          python -m unittest discover -s tests -p "test_network_abm*.py" -q
          python -m compileall -q narrative_dynamics tests tools/run_world_studio.py

      - name: Verify browser unit and accessibility contracts
        working-directory: world_studio_web
        run: |
          npm test -- --run
          npm run typecheck
          npm run build

      - name: Verify real law-firm browser flow
        working-directory: world_studio_web
        run: npx playwright test e2e/law-firm.spec.ts

      - name: Upload bounded Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-studio-playwright-diagnostics
          path: world_studio_web/test-results
          if-no-files-found: ignore
          retention-days: 3
