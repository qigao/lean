name: proof

on:
  push:
    branches:
      - master
      - proof/narrative-dynamics-v0
    paths-ignore:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/**"
  pull_request:
    paths-ignore:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/**"
  workflow_dispatch:

# A new head supersedes previous queued/in-progress runs for the same PR.
concurrency:
  group: lean-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mesh-projection:
    name: V24 situated mesh Python
    runs-on: ubuntu-latest
    concurrency:
      group: lean-ci-runner-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-world-studio.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-world-studio.txt
      - name: Check exact revision
        run: git rev-parse HEAD
      - name: Canonical V24 runtime vector conformance
        run: |
          set -euo pipefail
          pinned=conformance/mesh_runtime_vectors_v1.json
          mkdir -p .generated-conformance
          generated=.generated-conformance/mesh_runtime_vectors_v1.json
          # The checked-in vector is mandatory: this is no longer a bootstrap.
          test -f "$pinned"
          python3 -m tools.render_mesh_proof_vectors > "$generated"
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: reviewed V24 runtime vectors differ from authoritative export'
            exit 1
          fi
      - name: R1 immutable topology replay regression
        run: |
          set -euo pipefail
          python -m unittest tests.test_mesh_topology_revisions tests.test_social_topology_checkpoint -v
          mkdir -p .generated-conformance
          social_generated=.generated-conformance/social_topology_checkpoint_v1.json
          social_pinned=conformance/social_topology_checkpoint_v1.json
          python3 -m tools.render_social_topology_checkpoint_vectors > "$social_generated"
          # Required reviewed input; no bootstrap / auto-regeneration bypass.
          test -f "$social_pinned"
          if ! cmp -s "$social_pinned" "$social_generated"; then
            diff -u "$social_pinned" "$social_generated" || true
            echo 'RED: V19 social-topology source vectors changed'
            exit 1
          fi
          mkdir -p .generated-conformance
          generated=.generated-conformance/topology_revision_v1.json
          pinned=conformance/topology_revision_v1.json
          python3 -m tools.render_topology_revision_vectors > "$generated"
          # Required reviewed source/replay vector; no bootstrap fallback.
          test -f "$pinned"
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: R1 topology replay vectors differ from authoritative execution'
            exit 1
          fi
      - name: R2 three-driver V19/V24 observed-network regression
        run: |
          set -euo pipefail
          python -m unittest tests.test_network_evolution_observation -v
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_evolution_observation_v1.json
          pinned=conformance/network_evolution_observation_v1.json
          python3 -m tools.render_network_evolution_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: reviewed R2 observation vectors are missing'
            exit 1
          fi
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: R2 observations differ from exact V19 source revisions'
            exit 1
          fi
      - name: R2 M1 physical V19 passage-boundary events
        run: |
          set -euo pipefail
          python -m unittest tests.test_network_boundary_events -v
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_boundary_events_v1.json
          pinned=conformance/network_boundary_events_v1.json
          python3 -m tools.render_network_boundary_events > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: reviewed real V19 boundary event vectors are missing'
            exit 1
          fi
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: real V19 boundary events differ from reviewed source'
            exit 1
          fi
      - name: R2 M2 real V19 environment-action trace
        run: |
          set -euo pipefail
          python -m unittest tests.test_network_environment_actions -v
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_environment_action_v1.json
          pinned=conformance/network_environment_action_v1.json
          python3 -m tools.render_network_environment_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: reviewed V19 environmental action vectors are missing'
            exit 1
          fi
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: R2.M2 environment action source vectors differ'
            exit 1
          fi
      - name: R2 M3 exact V19 multi-Agent content evidence
        run: |
          set -euo pipefail
          python -m unittest tests.test_agent_content_evidence -v
          mkdir -p .generated-conformance
          generated=.generated-conformance/agent_content_evidence_v1.json
          pinned=conformance/agent_content_evidence_v1.json
          python3 -m tools.render_agent_content_evidence_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: reviewed V19 content evidence vectors are missing'
            exit 1
          fi
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: V19 Agent content evidence differs from exact source'
            exit 1
          fi
      - name: R2 M4a same-origin coupled V19 control and intervention
        run: |
          set -euo pipefail
          python -m unittest tests.test_network_coupled_evolution -v
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_coupled_evolution_v1.json
          pinned=conformance/network_coupled_evolution_v1.json
          python3 -m tools.render_network_coupled_evolution_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: reviewed same-origin R2.M4a V19 coupled vector is missing'
            exit 1
          fi
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: real coupled R2.M4a Agent/network evidence differs from reviewed source'
            exit 1
          fi
      - name: R2 M4b BB rewiring evolving native-family qualification
        run: |
          set -euo pipefail
          python -m unittest tests.test_network_model_family_comparison -v
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_model_family_comparison_v1.json
          pinned=conformance/network_model_family_comparison_v1.json
          python3 -m tools.render_model_family_comparison_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: reviewed model-native R2.M4b vector is missing'
            exit 1
          fi
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: R2.M4b independent native models differ from reviewed source'
            exit 1
          fi
      - name: R2 M4c0 preregistered native metric eligibility
        run: |
          set -euo pipefail
          python -m unittest tests.test_network_metric_protocol -v
          mkdir -p .generated-conformance
          generated=.generated-conformance/native_metric_protocol_v1.json
          pinned=conformance/native_metric_protocol_v1.json
          python3 -m tools.render_native_metric_protocol_vectors > "$generated"
          test -f "$pinned"
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: R2.M4c0 native metric source vector changed'
            exit 1
          fi
      - name: R2 M4c1 one-variable native paired control acceptance
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_native_paired_v1.json
          pinned=conformance/network_native_paired_v1.json
          python3 -m tools.render_network_native_paired_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: reviewed R2.M4c1 native paired source vector is missing'
            exit 1
          fi
          python -m unittest tests.test_network_native_paired -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: R2.M4c1 paired source differs from reviewed native vector'
            exit 1
          fi
      - name: R2 M5a source-owned passage decision authority
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_passage_authority_v1.json
          pinned=conformance/network_passage_authority_v1.json
          python3 -m tools.render_passage_authority_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: required reviewed V19 passage authority vector is absent'
            exit 1
          fi
          python -m unittest tests.test_network_power_authority -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: V19 passage authority source replay differs from reviewed bytes'
            exit 1
          fi
      - name: R2 M5b V19/V24 selected structural key-player qualification
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_source_structural_influence_v1.json
          pinned=conformance/network_source_structural_influence_v1.json
          python3 -m tools.render_source_structural_influence_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: required reviewed V19/V24 structural key-player vector is missing'
            exit 1
          fi
          python -m unittest tests.test_network_structural_influence -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: actual V19/V24 directed structural source differs from reviewed vector'
            exit 1
          fi
      - name: R2 M5c source-owned TELL verification and directed-trust acceptance
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_source_epistemic_influence_v1.json
          pinned=conformance/network_source_epistemic_influence_v1.json
          python3 -m tools.render_source_epistemic_influence_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: required reviewed V19 M5c epistemic source vector is missing'
            exit 1
          fi
          python -m unittest tests.test_network_epistemic_influence -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: M5c V19 cognitive and social source evidence differs'
            exit 1
          fi
      - name: R2 M5d original V19 post-evidence actions and trust-causal firewall
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_post_evidence_actual_actions_v1.json
          pinned=conformance/network_post_evidence_actual_actions_v1.json
          python3 -m tools.render_native_post_evidence_action_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: required reviewed native V19 post-evidence action vector is missing'
            exit 1
          fi
          python -m unittest tests.test_network_post_evidence_actions -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: V19 post-evidence actual actions differ from source review'
            exit 1
          fi
      - name: R2 M5e0 direct V19 EXACT TELL source trust protocol
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_native_direct_tell_trust_v1.json
          pinned=conformance/network_native_direct_tell_trust_v1.json
          python3 -m tools.render_native_direct_tell_trust_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: required reviewed native V19 direct TELL trust vector is missing'
            exit 1
          fi
          python3 -m unittest tests.test_network_direct_tell_trust -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: direct TELL source-trust native replay differs from source review'
            exit 1
          fi
      - name: R2 M5e1 source-learned trust before new native TELL
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_native_verified_trust_new_tell_v1.json
          pinned=conformance/network_native_verified_trust_new_tell_v1.json
          python3 -m tools.render_native_verified_trust_new_tell_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: exact reviewed M5e.1 trust-history source vector is missing'
            exit 1
          fi
          python3 -m unittest tests.test_network_trust_history_new_tell -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: M5e1 real source learning / later TELL replay differs'
            exit 1
          fi
      - name: R2 M5e2 source native two-choice MAP and reward integrity
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_native_two_choice_v1.json
          pinned=conformance/network_native_two_choice_v1.json
          python3 -m tools.render_native_two_choice_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: M5e2 reviewed source-native two-choice vector not committed'
            exit 1
          fi
          python3 -m unittest tests.test_network_native_two_choice -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: M5e2 V19 source two-choice decision differs from reviewed vector'
            exit 1
          fi
      - name: R2 M5f complete exploratory V19 speaking-cost response grid
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_native_speaking_cost_grid_v1.json
          pinned=conformance/network_native_speaking_cost_grid_v1.json
          python3 -m tools.render_native_speaking_cost_grid_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: exact reviewed M5f full source grid vector is missing'
            exit 1
          fi
          python3 -m unittest tests.test_network_native_response_grid -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: full native V19 M5f grid differs from reviewed source bytes'
            exit 1
          fi
      - name: R2 M5g0 V19 neutral audit trust learning without target-belief change
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_native_neutral_audit_v1.json
          pinned=conformance/network_native_neutral_audit_v1.json
          python3 -m tools.render_native_neutral_audit_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'RED: required reviewed M5g0 native neutral audit vector is missing'
            exit 1
          fi
          python3 -m unittest tests.test_network_neutral_audit_training -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: M5g0 V19 neutral audit/trust source differs'
            exit 1
          fi
      - name: R2 M5g1 V19 neutral training then new target TELL and native decision
        run: |
          set -euo pipefail
          mkdir -p .generated-conformance
          generated=.generated-conformance/network_native_neutral_target_v1.json
          pinned=conformance/network_native_neutral_target_v1.json
          python3 -m tools.render_native_neutral_target_vectors > "$generated"
          if [ ! -f "$pinned" ]; then
            echo 'R2_M5G1_NATIVE_VECTOR_BEGIN'
            cat "$generated"
            echo 'R2_M5G1_NATIVE_VECTOR_END'
            echo 'RED: source-reviewed V19 neutral target native decision vector is missing'
            exit 1
          fi
          python3 -m unittest tests.test_network_neutral_target_decision -v
          if ! cmp -s "$pinned" "$generated"; then
            diff -u "$pinned" "$generated" || true
            echo 'RED: native neutral audit/target decision differs from source review'
            exit 1
          fi
      - name: Runtime-derived mesh regression
        run: python -m unittest tests.test_mesh_projection tests.test_mesh_evidence -v

  python-tests:
    needs: mesh-projection
    # BB branches exclude peripheral discovery (Blender, providers and Studio).
    # These jobs remain enabled on other branches; skipped does not mean tested.
    if: ${{ success() && !startsWith(github.head_ref || github.ref_name, 'feature/fitness-') }}
    name: Python tests
    runs-on: ubuntu-latest
    concurrency:
      group: lean-ci-runner-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checked revision
        run: |
          printf 'event=%s ref=%s requested_sha=%s run=%s attempt=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-world-studio.txt
      - name: Install locked Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-world-studio.txt
      - name: Python numerical tests
        run: python -m unittest discover -s tests -v

  lean-proof:
    name: Lean proof
    needs: mesh-projection
    # Run independently of full Python to overlap their expensive acceptance gates.
    if: ${{ success() }}
    runs-on: ubuntu-latest
    concurrency:
      # A bounded proof lane allows overlap with Python on another runner.
      group: lean-ci-runner-lean-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checked revision
        run: |
          printf 'event=%s ref=%s requested_sha=%s run=%s attempt=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-

      - name: Resolve Lean dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          cat lean-toolchain
          lake env lean --version
          git -C .lake/packages/mathlib rev-parse HEAD

      - name: Cache checked Lean build products
        id: lean_products_cache
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-lake-products-v1-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ runner.os }}-lake-products-v1-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-
      - name: Lean Python conformance vectors
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            NarrativeDynamics.Core.Belief \
            NarrativeDynamics.Core.Drive \
            NarrativeDynamics.Core.Learning
          mkdir -p .generated-conformance
          generated=.generated-conformance/lean_reference_vectors.json
          if ! lake env lean --run NarrativeDynamics/Conformance/ReferenceVectors.lean \
              > "$generated"; then
            cat "$generated"
            exit 1
          fi
          if ! cmp conformance/lean_reference_vectors.json "$generated"; then
            diff -u conformance/lean_reference_vectors.json "$generated" || true
            exit 1
          fi

      - name: Fitness trust audit regression tests
        run: python3 -m unittest tests.test_fitness_trust_audit -v

      - name: Build Lean library
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          printf 'Lean build product exact-key cache hit=%s\n' '${{ steps.lean_products_cache.outputs.cache-hit }}'
          /usr/bin/time -f 'Lean full library build elapsed=%e s peak_rss=%M KiB' lake build

      - name: V24 finite runtime mesh Lean conformance
        timeout-minutes: 8
        run: bash tools/check_mesh_evidence_lean.sh

      - name: BB ABM joint evolution contracts
        timeout-minutes: 25
        run: bash tools/check_fitness_abm.sh

      - name: BB ABM runtime replay conformance
        timeout-minutes: 15
        run: bash tools/check_fitness_abm_runtime.sh

      - name: BB path-four convergence
        timeout-minutes: 15
        run: bash tools/check_fitness_abm_path4.sh

      - name: BB finite-path convergence
        timeout-minutes: 15
        run: bash tools/check_fitness_abm_pathn.sh

      - name: PathN exposure consensus analyzer
        timeout-minutes: 20
        run: bash tools/check_narrative_analyzer.sh

      - name: BB-only naming audit
        run: |
          set -euo pipefail
          short="$(printf '%s%s' B A)"
          lower="$(printf '%s%s' b a)"
          full_ascii="$(printf '%s%s' 'Barabasi-' 'Albert')"
          full_ascii_double="$(printf '%s%s' 'Barabasi--' 'Albert')"
          full_accent_ascii="$(printf '%s%s' 'Barabási-' 'Albert')"
          full_unicode="$(printf '%s%s' 'Barabási–' 'Albert')"
          found=0
          if git grep -n -E "(^|[^[:alnum:]_])${short}([^[:alnum:]_]|$)" -- .; then
            found=1
          fi
          for term in \
            "$full_ascii" "$full_ascii_double" "$full_accent_ascii" "$full_unicode" \
            "as${short}" "${lower}Row" \
            "attachment_${lower}" "orderedMass_${lower}" \
            "replay_${lower}_"; do
            if git grep -n -F "$term" -- .; then
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo 'legacy attachment-model surface remains'
            exit 1
          fi

      - name: Fitness attachment contract tests
        timeout-minutes: 5
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean NarrativeDynamics/Tests/FitnessAttachment.lean
          lake env lean NarrativeDynamics/Tests/FitnessBirth.lean
          lake env lean NarrativeDynamics/Tests/FitnessValidation.lean

      - name: Fitness replay acceptance
        timeout-minutes: 5
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          # A proof error or wall-clock timeout must fail the acceptance gate.
          /usr/bin/time -f 'FitnessReplay elapsed=%e s peak_rss=%M KiB' \
            timeout --kill-after=10s 240s \
            stdbuf -oL -eL lake env lean -DmaxErrors=1 -DstderrAsMessages=false \
              NarrativeDynamics/Tests/FitnessReplay.lean

      - name: Fitness scope counterexample
        timeout-minutes: 5
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          /usr/bin/time -f 'FitnessScope elapsed=%e s peak_rss=%M KiB' \
            timeout --kill-after=10s 240s \
              lake env lean -DmaxErrors=8 \
              NarrativeDynamics/Tests/FitnessScope.lean

      - name: Fitness distribution contract tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          lake env lean NarrativeDynamics/Tests/FitnessDistribution.lean 2>&1 | tee "$log"
          python3 tools/audit_fitness_trust.py log "$log" \
            --require NarrativeDynamics.FitnessAttachment.traceProbability_pos \
            --require NarrativeDynamics.FitnessAttachment.traceProbability_sum_continuationMass \
            --require NarrativeDynamics.FitnessAttachment.traceProbability_sum_one \
            --require NarrativeDynamics.FitnessAttachment.traceProbability_le_one \
            --require NarrativeDynamics.FitnessAttachment.traceFinal_nodes \
            --require NarrativeDynamics.FitnessAttachment.traceFinal_edges \
            --require NarrativeDynamics.FitnessAttachment.traceFinal_fitness \
            --require NarrativeDynamics.FitnessAttachment.traceFinal_valid \
            --require NarrativeDynamics.FitnessAttachment.eventProbability_true \
            --require NarrativeDynamics.FitnessAttachment.eventProbability_false \
            --require NarrativeDynamics.FitnessAttachment.eventProbability_nonneg \
            --require NarrativeDynamics.FitnessAttachment.eventProbability_le_one \
