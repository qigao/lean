name: proof

on:
  push:
    paths-ignore:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/**"
  pull_request:
    paths-ignore:
      - "docs/superpowers/specs/**"
      - "docs/superpowers/plans/**"

jobs:
  lean-proof:
    name: Lean proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checked revision
        run: |
          printf 'event=%s ref=%s requested_sha=%s run=%s attempt=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain') }}-

      - name: Resolve Lean dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          cat lean-toolchain
          lake env lean --version
          git -C .lake/packages/mathlib rev-parse HEAD

      - name: Lean Python conformance vectors
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build \
            NarrativeDynamics.Core.Belief \
            NarrativeDynamics.Core.Drive \
            NarrativeDynamics.Core.Learning
          mkdir -p .generated-conformance
          generated=.generated-conformance/lean_reference_vectors.json
          if ! lake env lean --run NarrativeDynamics/Conformance/ReferenceVectors.lean \
              > "$generated"; then
            cat "$generated"
            exit 1
          fi
          if ! cmp conformance/lean_reference_vectors.json "$generated"; then
            diff -u conformance/lean_reference_vectors.json "$generated" || true
            exit 1
          fi

      - name: Build Lean library
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      - name: Fitness attachment contract tests
        timeout-minutes: 5
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean NarrativeDynamics/Tests/FitnessAttachment.lean
          lake env lean NarrativeDynamics/Tests/FitnessBirth.lean
          lake env lean NarrativeDynamics/Tests/FitnessValidation.lean

      - name: Fitness replay acceptance
        timeout-minutes: 5
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          # A proof error or wall-clock timeout must fail the acceptance gate.
          /usr/bin/time -f 'FitnessReplay elapsed=%e s peak_rss=%M KiB' \
            timeout --kill-after=10s 240s \
            stdbuf -oL -eL lake env lean -DmaxErrors=1 -DstderrAsMessages=false \
              NarrativeDynamics/Tests/FitnessReplay.lean

      - name: Lean theorem tests
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean NarrativeDynamics/Tests/Drive.lean
          lake env lean NarrativeDynamics/Tests/Collective.lean
          lake env lean NarrativeDynamics/Tests/Learning.lean
          lake env lean NarrativeDynamics/Tests/Belief.lean
          lake env lean NarrativeDynamics/Tests/Strategy.lean
          lake env lean NarrativeDynamics/Tests/Epistemic.lean
          lake env lean NarrativeDynamics/Tests/VectorStrategy.lean
          lake env lean NarrativeDynamics/Tests/WorldGraph.lean
          lake env lean NarrativeDynamics/Tests/TemporalGraph.lean
          lake env lean NarrativeDynamics/Tests/TypedGraph.lean
          lake env lean NarrativeDynamics/Tests/SocialMesh.lean
          lake env lean NarrativeDynamics/Tests/SmallWorld.lean
          lake env lean NarrativeDynamics/Tests/SmallWorldMetrics.lean
          lake env lean NarrativeDynamics/Tests/WattsStrogatz.lean
          lake env lean NarrativeDynamics/Tests/TypedHypergraph.lean
          lake env lean NarrativeDynamics/Tests/TypedInference.lean
          lake env lean NarrativeDynamics/Tests/Closure.lean
          lake env lean NarrativeDynamics/Tests/Provenance.lean
          lake env lean NarrativeDynamics/Tests/TruthMaintenance.lean
          lake env lean NarrativeDynamics/Tests/BeliefSupport.lean
          lake env lean NarrativeDynamics/Tests/EpistemicBelief.lean
          lake env lean NarrativeDynamics/Tests/Interpretation.lean
          lake env lean NarrativeDynamics/Tests/ObservationAdmission.lean
          lake env lean NarrativeDynamics/Tests/CognitivePipeline.lean
          lake env lean NarrativeDynamics/Tests/HypothesisCompetition.lean
          lake env lean NarrativeDynamics/Tests/GroundedHypothesisSpace.lean
          lake env lean NarrativeDynamics/Tests/GroundedBeliefUpdate.lean
          lake env lean NarrativeDynamics/Tests/InterpretationCommitment.lean
          lake env lean NarrativeDynamics/Tests/InterpretationSelection.lean
          lake env lean NarrativeDynamics/Tests/EpistemicGoal.lean
          lake env lean NarrativeDynamics/Tests/EpistemicGoalCompetition.lean
          lake env lean NarrativeDynamics/Tests/GroundedEpistemicGoal.lean
          lake env lean NarrativeDynamics/Tests/GroundedGoalCovariance.lean
          lake env lean NarrativeDynamics/Tests/GroundedGoalScoreCovariance.lean
          lake env lean NarrativeDynamics/Tests/GroundedGoalRankingReversal.lean
          lake env lean NarrativeDynamics/Tests/GroundedGoalSoftmax.lean

      - name: Narrative story theorem tests
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean NarrativeDynamics/Tests/StoryState.lean

      - name: Narrative testimony theorem tests
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean NarrativeDynamics/Tests/Testimony.lean

  python-tests:
    # BB branches exclude peripheral discovery (Blender, providers and Studio).
    # These jobs remain enabled on other branches; skipped does not mean tested.
    if: ${{ !startsWith(github.head_ref, 'feature/fitness-') && !startsWith(github.ref, 'refs/heads/feature/fitness-') }}
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checked revision
        run: |
          printf 'event=%s ref=%s requested_sha=%s run=%s attempt=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD
      - name: Python numerical tests
        run: python3 -m unittest discover -s tests -v
