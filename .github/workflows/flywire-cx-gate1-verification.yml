name: flywire-cx-gate1-verification

on:
  push:
    branches:
      - research/flywire-cx-temporal-gate1
    paths:
      - "python/**"
      - "tests/**"
      - "protocols/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - "Lean/**"
      - ".github/workflows/flywire-cx-gate1-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-full:
    name: Full Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install CPU-only test runtime
        run: |
          python -m pip install pytest numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e ./python
      - name: Run complete Python suite
        run: python -m pytest tests -q

  lean-full:
    name: Full Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean project
        run: lake build
