name: archive-final-r3

on:
  push:
    branches:
      - manual/empirical-r3-internal-final

permissions:
  contents: write

jobs:
  archive-final:
    if: "${{ github.event.head_commit.message == 'research: archive empirical revision 3 final evidence' }}"
    name: Archive Empirical Revision 3 FINAL evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout FINAL evidence branch
        uses: actions/checkout@v4
        with:
          repository: qigao/lean
          ref: final/feher-hare-r3
          path: final-state
          fetch-depth: 1

      - name: Download, verify, archive, round-trip verify, and commit FINAL evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          EXPECTED_PARENT=71c961d5d5c13ee8d435d636c3214d7edf55f0e7
          ARTIFACT_ID=9724984284
          EXPECTED_ZIP_SHA=80462b8f8bb7de26fc159b378213a5d324af536fd34d17721653f58d03ab14d0
          DEST=final-state/research-final/feher-hare-r3/evidence
          ARCHIVE=feher-hare-real-final-r3-33287374761.tar.xz

          test "$(git -C final-state rev-parse HEAD)" = "$EXPECTED_PARENT"
          test ! -e "$DEST/$ARCHIVE"
          test ! -e "$DEST/archive_manifest.json"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/qigao/lean/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/r3-final.zip"
          echo "${EXPECTED_ZIP_SHA}  $RUNNER_TEMP/r3-final.zip" | sha256sum --check --strict

          mkdir -p "$RUNNER_TEMP/r3-final"
          unzip -q "$RUNNER_TEMP/r3-final.zip" -d "$RUNNER_TEMP/r3-final"
          cd "$RUNNER_TEMP/r3-final"

          cat > "$RUNNER_TEMP/files.sha256" <<'EOF'
          eb9722169569cd2601d9f6e7727e949c78a7a1638f693e644c41ec88acaee726  attempt_ledger.json
          55c9411c8d110c0b33794b076e204f7fa81f9bd856d7233a8823645008ecc0ca  external_evaluation.json
          5a4ec1d9433e66509aca058a3340c0fb5efd52e2e46d910ffcc896fe055e72e2  brier_score.json
          6a8fea934b7f4689924ade20c2c26c7f4cf99cfa0167deeed6a0a968c4b40c34  log_score.json
          0bde3b5230fec0c0619e7b9836dff03ed961352e94cd9de1e2d182500c66ab12  prediction_artifact.json
          0242c1aaefe5386f48ca70d097f2fa24747fc89cf4b4f86369db285fa1a43bcc  report_summary.json
          f278cf705bf2f40ea328046047261ac915da1cd6b1c883b2428bf3ae567f0af1  stay_switch_diagnostic.json
          eccdf3d72e936214aff7de15e5b76310464b7856a4b1d7f1fa87728f433239fc  terminal.json
          EOF
          sha256sum --check --strict "$RUNNER_TEMP/files.sha256"

          EXPECTED_NAMES="attempt_ledger.json brier_score.json external_evaluation.json log_score.json prediction_artifact.json report_summary.json stay_switch_diagnostic.json terminal.json "
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "$EXPECTED_NAMES"

          mkdir -p "$GITHUB_WORKSPACE/$DEST"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cJf "$GITHUB_WORKSPACE/$DEST/$ARCHIVE" \
            attempt_ledger.json external_evaluation.json brier_score.json log_score.json \
            prediction_artifact.json report_summary.json stay_switch_diagnostic.json terminal.json
          ARCHIVE_SHA="$(sha256sum "$GITHUB_WORKSPACE/$DEST/$ARCHIVE" | awk '{print $1}')"

          mkdir -p "$RUNNER_TEMP/roundtrip"
          tar -xJf "$GITHUB_WORKSPACE/$DEST/$ARCHIVE" -C "$RUNNER_TEMP/roundtrip"
          cd "$RUNNER_TEMP/roundtrip"
          sha256sum --check --strict "$RUNNER_TEMP/files.sha256"
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "$EXPECTED_NAMES"

          python3 - "$GITHUB_WORKSPACE/$DEST/archive_manifest.json" "$ARCHIVE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          archive_sha = sys.argv[2]
          payload = {
              "schema": "feher-hare-r3-final-durable-archive-v1",
              "scientific_repository_revision": "d01232979cdfc9d902daab5f9e3e937079b56f69",
              "lock_commit": "f09d6afc96f0a720dd5e8e810f440cda0fe9f8a3",
              "final_terminal_commit": "71c961d5d5c13ee8d435d636c3214d7edf55f0e7",
              "github_actions_run_id": 33287374761,
              "github_actions_artifact_id": 9724984284,
              "github_actions_zip_sha256": "80462b8f8bb7de26fc159b378213a5d324af536fd34d17721653f58d03ab14d0",
              "archive_format": "tar-xz",
              "archive_file": "feher-hare-real-final-r3-33287374761.tar.xz",
              "archive_sha256": archive_sha,
              "archive_round_trip_verified": True,
              "canonical_identity_is_per_file_sha256": True,
              "files": {
                  "attempt_ledger.json": "eb9722169569cd2601d9f6e7727e949c78a7a1638f693e644c41ec88acaee726",
                  "external_evaluation.json": "55c9411c8d110c0b33794b076e204f7fa81f9bd856d7233a8823645008ecc0ca",
                  "brier_score.json": "5a4ec1d9433e66509aca058a3340c0fb5efd52e2e46d910ffcc896fe055e72e2",
                  "log_score.json": "6a8fea934b7f4689924ade20c2c26c7f4cf99cfa0167deeed6a0a968c4b40c34",
                  "prediction_artifact.json": "0bde3b5230fec0c0619e7b9836dff03ed961352e94cd9de1e2d182500c66ab12",
                  "report_summary.json": "0242c1aaefe5386f48ca70d097f2fa24747fc89cf4b4f86369db285fa1a43bcc",
                  "stay_switch_diagnostic.json": "f278cf705bf2f40ea328046047261ac915da1cd6b1c883b2428bf3ae567f0af1",
                  "terminal.json": "eccdf3d72e936214aff7de15e5b76310464b7856a4b1d7f1fa87728f433239fc",
              },
              "raw_human_rows_in_archive": False,
              "final_execution_replay": False,
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          cd "$GITHUB_WORKSPACE"
          git -C final-state config user.name "qigao-r3-final-archive"
          git -C final-state config user.email "qigao-r3-final-archive@users.noreply.github.com"
          git -C final-state add research-final/feher-hare-r3/evidence
          test "$(git -C final-state diff --cached --name-only | sort | tr '\n' ' ')" = \
            "research-final/feher-hare-r3/evidence/archive_manifest.json research-final/feher-hare-r3/evidence/feher-hare-real-final-r3-33287374761.tar.xz "
          git -C final-state commit -m "research: archive empirical revision 3 final evidence"
          test "$(git -C final-state rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git -C final-state push origin HEAD:refs/heads/final/feher-hare-r3

          echo "ARCHIVE_COMMIT=$(git -C final-state rev-parse HEAD)"
          echo "ARCHIVE_SHA256=${ARCHIVE_SHA}"
          echo "FINAL_EXECUTION_REPLAY=false"
