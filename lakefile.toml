name = "browser_runtime"
version = "0.1.0"
defaultTargets = [
  "Browser",

  # Public proof verification executables.
  "browser-interaction-check",
  "browser-recovery-check",
  "browser-feedback-recovery-check",
  "browser-decoder-recovery-check",
  "browser-adversarial-recovery-check",
  "browser-fault-aggregation-check",
  "browser-trace-aggregation-check",
  "browser-closed-loop-check",

  # Integration/reference regression executables.
  "browser-driver-interaction-journal-check",
  "browser-interaction-trace-check",
  "browser-runtime-check",
  "browser-driver-trace-check",
  "browser-async-trace-check",
]

[[lean_lib]]
name = "Browser"

# Public proof verification executables.

[[lean_exe]]
name = "browser-interaction-check"
root = "InteractionTraceMain"

[[lean_exe]]
name = "browser-recovery-check"
root = "RecoveryTraceMain"

[[lean_exe]]
name = "browser-feedback-recovery-check"
root = "FeedbackRecoveryMain"

[[lean_exe]]
name = "browser-decoder-recovery-check"
root = "DecoderRecoveryMain"

[[lean_exe]]
name = "browser-adversarial-recovery-check"
root = "AdversarialRecoveryMain"

[[lean_exe]]
name = "browser-fault-aggregation-check"
root = "FaultAggregationMain"

[[lean_exe]]
name = "browser-trace-aggregation-check"
root = "TraceAggregationMain"

[[lean_exe]]
name = "browser-closed-loop-check"
root = "ClosedLoopMain"

# Integration/reference regression executables.

[[lean_exe]]
name = "browser-driver-interaction-journal-check"
root = "DriverInteractionJournalMain"

[[lean_exe]]
name = "browser-interaction-trace-check"
root = "InteractionJournalMain"

[[lean_exe]]
name = "browser-runtime-check"
root = "Main"

[[lean_exe]]
name = "browser-driver-trace-check"
root = "DriverTraceMain"

[[lean_exe]]
name = "browser-async-trace-check"
root = "AsyncTraceMain"
